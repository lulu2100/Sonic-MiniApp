<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini-App</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- ===== AJOUT PANIER (CSS) ===== -->
  <style>
    .cartFab{
      position: fixed;
      top: 110px;
      right: 14px;
      z-index: 9999;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: rgba(20,20,26,.85);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .cartBadge{
      position:absolute;
      top:-8px;
      right:-8px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#ff3b30;
      color:#fff;
      font-weight:900;
      font-size: 13px;
      border: 2px solid rgba(0,0,0,.25);
    }

    .cartModal{
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0,0,0,.55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .cartModal.hidden{ display:none; }

    .cartSheet{
      width: min(560px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: rgba(20,20,26,.95);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px 18px 0 0;
      padding: 14px;
      backdrop-filter: blur(14px);
      color: #fff;
    }

    .cartHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 10px;
    }
    .cartTitle{ font-size: 26px; font-weight: 900; }
    .cartClose{
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      padding: 6px 10px;
    }

    .cartItems{ display:flex; flex-direction:column; gap: 10px; margin: 10px 0 14px; }

    .cartItem{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      padding: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .cartItemLeft{ display:flex; flex-direction:column; gap: 6px; }
    .cartItemName{ font-weight: 900; }
    .cartItemSub{ opacity: .85; font-size: 14px; }

    .cartItemRight{ display:flex; align-items:center; gap: 10px; }
    .qtyBtn{
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:#fff;
      font-weight: 900;
      cursor:pointer;
    }
    .qtyVal{ min-width: 22px; text-align:center; font-weight: 900; }
    .trashBtn{
      width: 40px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:#fff;
      cursor:pointer;
    }

    .cartTotalRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      font-weight: 800;
    }
    .cartTotal{ font-size: 26px; font-weight: 900; color: #2d8cff; }
  </style>
  <!-- ===== /AJOUT PANIER (CSS) ===== -->
</head>

<body>

  <div class="top">
    <video class="banner-video" autoplay muted loop playsinline>
      <source src="https://raw.githubusercontent.com/lulu2100/Sonic-MiniApp/7bdc0fceef84572dfd89841c408dedc5da40c9bc/IMG_9955.MP4">
    </video>

    <div class="logo">
      <img id="shopLogo"
        src="https://raw.githubusercontent.com/lulu2100/Sonic-MiniApp/907551737b83eed871d3728f82148619b58f1961/IMAGE%202026-01-28%2000%3A02%3A50.jpg"
        alt="Logo SonicCoffee">
    </div>

    <div id="shopName" class="shop-name">SonicCoffee</div>
  </div>

  <div class="filters">
    <select id="catSelect"><option value="">Toutes les catégories</option></select>
    <select id="brandSelect"><option value="">Toutes les farms</option></select>
  </div>

  <div class="grid" id="grid"></div>
  <div class="spacer"></div>

  <div class="bottom-bar">
    <div class="tab"><b>Menu</b></div>
    <div class="tab"><b>Infos</b></div>
    <div class="tab"><b>Canal</b></div>
    <div class="tab"><b>Contact</b></div>
  </div>

  <!-- ===== AJOUT PANIER (HTML) ===== -->
  <div id="cartFab" class="cartFab" title="Panier">
    🛒
    <div id="cartBadge" class="cartBadge">0</div>
  </div>

  <div id="cartModal" class="cartModal hidden">
    <div class="cartSheet">
      <div class="cartHeader">
        <div class="cartTitle">Votre Panier</div>
        <button id="cartClose" class="cartClose">✕</button>
      </div>

      <div id="cartItems" class="cartItems"></div>

      <div class="cartTotalRow">
        <div>Total :</div>
        <div id="cartTotal" class="cartTotal">0 €</div>
      </div>
    </div>
  </div>
  <!-- ===== /AJOUT PANIER (HTML) ===== -->

<script>
  let DATA;
  function uniq(arr){ return [...new Set(arr.filter(Boolean))].sort(); }

  function render(){
    const cat = document.getElementById('catSelect').value;
    const brand = document.getElementById('brandSelect').value;

    const list = DATA.products.filter(p=>{
      if(cat && p.category!==cat) return false;
      if(brand && p.brand!==brand) return false;
      return true;
    });

    const grid = document.getElementById('grid');
    grid.innerHTML = "";

    list.forEach(p=>{
      const card = document.createElement('div');
      card.className = "card";
      card.onclick = ()=> location.href = `product.html?id=${encodeURIComponent(p.id)}`;

      card.innerHTML = `
        <div class="tag">🏷️ ${p.category || ""}</div>
        <div class="img"><img src="${p.image || ""}" alt=""></div>
        <div class="body">
          <p class="name">${p.name || ""}</p>
          <p class="sub">🕵️ ${p.brand || ""}</p>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  (async ()=>{
    const res = await fetch('products.json', {cache:'no-store'});
    DATA = await res.json();

    document.getElementById('shopName').textContent = DATA.shopName || "Mini-App";
    document.getElementById('shopLogo').src = DATA.shopLogo || document.getElementById('shopLogo').src;

    const cats = uniq(DATA.products.map(p=>p.category));
    const brands = uniq(DATA.products.map(p=>p.brand));

    const catSelect = document.getElementById('catSelect');
    cats.forEach(c=>{
      const o = document.createElement('option'); o.value=c; o.textContent=c;
      catSelect.appendChild(o);
    });

    const brandSelect = document.getElementById('brandSelect');
    brands.forEach(b=>{
      const o = document.createElement('option'); o.value=b; o.textContent=b;
      brandSelect.appendChild(o);
    });

    catSelect.onchange = render;
    brandSelect.onchange = render;

    render();

    // ===== AJOUT PANIER (init après chargement DATA) =====
    renderCartUI();
  })();

  document.addEventListener('touchstart', () => {
    const v = document.querySelector('.banner-video');
    if (v) v.play();
  }, { once: true });

  // ===== AJOUT PANIER (JS) =====
  const CART_KEY = "sonic_cart_v1";

  function loadCart(){
    try { return JSON.parse(localStorage.getItem(CART_KEY) || "[]"); }
    catch { return []; }
  }
  function saveCart(cart){
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }
  function makeKey(it){
    return `${it.product}__${it.qty}`;
  }
  function cartCount(cart){
    return cart.reduce((s,it)=> s + (it.count || 1), 0);
  }
  function cartTotal(cart){
    return cart.reduce((s,it)=> s + (Number(it.price||0) * (it.count||1)), 0);
  }

  function openCart(){
    document.getElementById("cartModal")?.classList.remove("hidden");
    renderCartUI();
  }
  function closeCart(){
    document.getElementById("cartModal")?.classList.add("hidden");
  }

  function renderCartUI(){
    const cart = loadCart();

    const badge = document.getElementById("cartBadge");
    if (badge) badge.textContent = String(cartCount(cart));

    const itemsEl = document.getElementById("cartItems");
    if (!itemsEl) return;

    itemsEl.innerHTML = "";

    if (cart.length === 0){
      const empty = document.createElement("div");
      empty.style.opacity = ".85";
      empty.style.padding = "10px";
      empty.textContent = "Ton panier est vide.";
      itemsEl.appendChild(empty);
    } else {
      cart.forEach(it=>{
        const row = document.createElement("div");
        row.className = "cartItem";

        const left = document.createElement("div");
        left.className = "cartItemLeft";

        const title = document.createElement("div");
        title.className = "cartItemName";
        title.textContent = it.product || "-";

        const sub = document.createElement("div");
        sub.className = "cartItemSub";
        sub.textContent = `${it.qty || "-"} — ${Number(it.price||0)}€ / unité`;

        left.appendChild(title);
        left.appendChild(sub);

        const right = document.createElement("div");
        right.className = "cartItemRight";

        const minus = document.createElement("button");
        minus.className = "qtyBtn";
        minus.textContent = "−";
        minus.onclick = () => {
          const c = loadCart();
          const key = makeKey(it);
          const idx = c.findIndex(x => makeKey(x) === key);
          if (idx >= 0){
            c[idx].count = (c[idx].count || 1) - 1;
            if (c[idx].count <= 0) c.splice(idx, 1);
            saveCart(c);
            renderCartUI();
          }
        };

        const qty = document.createElement("div");
        qty.className = "qtyVal";
        qty.textContent = String(it.count || 1);

        const plus = document.createElement("button");
        plus.className = "qtyBtn";
        plus.textContent = "+";
        plus.onclick = () => {
          const c = loadCart();
          const key = makeKey(it);
          const idx = c.findIndex(x => makeKey(x) === key);
          if (idx >= 0){
            c[idx].count = (c[idx].count || 1) + 1;
            saveCart(c);
            renderCartUI();
          }
        };

        const trash = document.createElement("button");
        trash.className = "trashBtn";
        trash.textContent = "🗑️";
        trash.onclick = () => {
          const c = loadCart().filter(x => makeKey(x) !== makeKey(it));
          saveCart(c);
          renderCartUI();
        };

        right.appendChild(minus);
        right.appendChild(qty);
        right.appendChild(plus);
        right.appendChild(trash);

        row.appendChild(left);
        row.appendChild(right);

        itemsEl.appendChild(row);
      });
    }

    const totalEl = document.getElementById("cartTotal");
    if (totalEl) totalEl.textContent = `${cartTotal(cart).toFixed(2)} €`;
  }

  // events
  document.getElementById("cartFab")?.addEventListener("click", openCart);
  document.getElementById("cartClose")?.addEventListener("click", closeCart);
  document.getElementById("cartModal")?.addEventListener("click", (e)=>{
    if (e.target && e.target.id === "cartModal") closeCart();
  });

  // refresh badge when coming back to index
  window.addEventListener("focus", renderCartUI);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) renderCartUI();
  });
  // ===== /AJOUT PANIER (JS) =====
</script>
</body>
</html>
