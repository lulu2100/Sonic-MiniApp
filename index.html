<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini-App</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- ✅ CSS panier (comme tes photos 3-4) -->
  <style>
    .cartFab{
      position: fixed;
      right: 14px;
      top: 110px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(20,20,26,.72);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff;
      backdrop-filter: blur(10px);
      cursor: pointer;
      font-weight: 800;
    }
    .cartCount{
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ff3b30;
      color: #fff;
      font-weight: 900;
      font-size: 14px;
    }

    .cartModal{
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0,0,0,.55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .cartModal.hidden{ display:none; }

    .cartSheet{
      width: min(560px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: rgba(20,20,26,.95);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px 22px 0 0;
      padding: 14px 14px 18px;
      backdrop-filter: blur(14px);
      color: #fff;
    }

    .cartHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 10px;
    }
    .cartTitle{ font-size: 34px; font-weight: 900; letter-spacing:.2px; }
    .cartClose{
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      font-weight: 900;
      padding: 8px 10px;
    }

    .cartItems{ display:flex; flex-direction:column; gap: 10px; margin: 10px 0 14px; }

    .cartItem{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      padding: 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .cartItemLeft{ display:flex; flex-direction:column; gap: 6px; }
    .cartItemName{ font-weight: 900; font-size: 18px; }
    .cartItemSub{ opacity: .85; font-size: 14px; }

    .cartItemRight{ display:flex; align-items:center; gap: 10px; }
    .qtyBtn{
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:#fff;
      font-weight: 900;
      cursor:pointer;
      font-size: 18px;
    }
    .qtyVal{ min-width: 22px; text-align:center; font-weight: 900; font-size: 16px; }
    .trashBtn{
      width: 46px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:#fff;
      cursor:pointer;
      font-size: 18px;
    }

    .cartTotalRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      font-weight: 900;
      font-size: 18px;
    }
    .cartTotal{ font-size: 28px; font-weight: 900; color: #2d8cff; }

    .cartSectionTitle{
      margin: 6px 0 10px;
      font-weight: 900;
      opacity: .95;
      font-size: 18px;
    }
    .cartRadios{ display:flex; gap: 18px; margin-bottom: 12px; }
    .radioLine{ display:flex; gap: 10px; align-items:center; font-weight: 900; font-size: 18px; }
    .radioLine input{ transform: scale(1.25); }

    .cartForm{ display:flex; flex-direction:column; gap: 10px; margin-bottom: 12px; }
    .cartInput, .cartTextarea{
      width: 100%;
      padding: 14px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: #fff;
      outline: none;
      font-size: 16px;
    }
    .cartTextarea{ min-height: 80px; resize: vertical; }
    .hidden{ display:none !important; }

    .cartConfirm{
      width: 100%;
      padding: 16px 14px;
      border-radius: 16px;
      border: 0;
      background: #2d8cff;
      color: #071021;
      font-weight: 900;
      font-size: 18px;
      cursor: pointer;
    }

    /* =========================
       ✅ AJOUT MENU (bouton + panneau + pages)
       ========================= */

    /* Bouton menu (en haut à droite, comme sur tes photos) */
    .menuBtn{
      position: absolute;
      top: 14px;
      right: 14px;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.25);
      color: #fff;
      display: grid;
      place-items: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      z-index: 60;
    }
    .menuBtn svg{opacity:.9}

    /* Drawer menu */
    .menuModal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 12000;
      display: flex;
      justify-content: flex-end;
    }
    .menuModal.hidden{ display:none !important; }

    .menuDrawer{
      width: min(320px, 86vw);
      height: 100%;
      background: rgba(15,18,26,.92);
      border-left: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 18px 16px;
      display:flex;
      flex-direction:column;
      gap: 18px;
    }
    .menuClose{
      align-self: flex-end;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color:#fff;
      font-size: 22px;
      cursor:pointer;
    }
    .menuItem{
      font-size: 22px;
      font-weight: 700;
      color: rgba(255,255,255,.72);
      padding: 10px 6px;
      cursor: pointer;
    }
    .menuItem.active{
      color: #59b5ff;
    }

    /* Pages (Promo/Infos/Contact) */
    .page{
      padding: 18px 14px 90px;
      max-width: 900px;
      margin: 0 auto;
    }
    .pageTitle{
      font-size: 34px;
      font-weight: 900;
      margin: 18px 0 18px;
      color: #e9eef7;
    }
    .centerIcon{
      width: 78px;
      height: 78px;
      border-radius: 999px;
      background: rgba(89,181,255,.15);
      border: 1px solid rgba(89,181,255,.25);
      display:grid;
      place-items:center;
      margin: 18px auto 10px;
    }
    .btnBig{
      width: 100%;
      padding: 16px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.07);
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
    }
    .btnBig + .btnBig{ margin-top: 14px; }

    .promoList{ display:flex; flex-direction:column; gap: 14px; }
    .promoCard{
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }
    .promoLeft{ display:flex; flex-direction:column; gap: 8px; }
    .promoBadges{ display:flex; gap: 10px; }
    .pillBadge{
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 13px;
      display:inline-flex;
      align-items:center;
      gap: 6px;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.14);
    }
    .pillRed{ background: rgba(255,59,48,.18); border-color: rgba(255,59,48,.25); }
    .promoTitle{ font-weight: 900; font-size: 18px; }
    .promoPrice{
      font-weight: 900;
      font-size: 22px;
      color: #59b5ff;
      white-space: nowrap;
    }
    .promoOld{
      text-decoration: line-through;
      opacity: .55;
      margin-right: 10px;
      font-weight: 700;
      font-size: 16px;
      color: #cfd7e6;
    }
  </style>
</head>

<body>

  <div class="top">
    <video class="banner-video" autoplay muted loop playsinline>
      <source src="https://raw.githubusercontent.com/lulu2100/Sonic-MiniApp/7bdc0fceef84572dfd89841c408dedc5da40c9bc/IMG_9955.MP4">
    </video>

    <div class="logo">
      <img id="shopLogo"
        src="https://raw.githubusercontent.com/lulu2100/Sonic-MiniApp/907551737b83eed871d3728f82148619b58f1961/IMAGE%202026-01-28%2000%3A02%3A50.jpg"
        alt="Logo SonicCoffee">
    </div>

    <div id="shopName" class="shop-name">SonicCoffee</div>

    <!-- ✅ AJOUT : bouton menu (☰) -->
    <button id="menuBtn" class="menuBtn" type="button" title="Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <!-- ✅ PAGE ACCUEIL (ton contenu inchangé, juste mis dans un conteneur) -->
  <div id="pageHome">
    <div class="filters">
      <select id="catSelect"><option value="">Toutes les catégories</option></select>
      <select id="brandSelect"><option value="">Toutes les farms</option></select>
    </div>

    <div class="grid" id="grid"></div>
    <div class="spacer"></div>

    <div class="bottom-bar">
      <div class="tab"><b>Menu</b></div>
      <div class="tab"><b>Infos</b></div>
      <div class="tab"><b>Canal</b></div>
      <div class="tab"><b>Contact</b></div>
    </div>
  </div>

  <!-- ✅ PAGE Pack / Promo -->
  <div id="pagePromo" class="page hidden">
    <div class="centerIcon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 1 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 1 0 0-4V8Z" stroke="#59b5ff" stroke-width="2" stroke-linejoin="round"/>
        <path d="M9 9h.01M9 12h.01M9 15h.01" stroke="#59b5ff" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="pageTitle">Promotions du moment</div>
    <div id="promoList" class="promoList"></div>
  </div>

  <!-- ✅ PAGE Informations -->
  <div id="pageInfos" class="page hidden">
    <div class="centerIcon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 17v-6" stroke="#59b5ff" stroke-width="2" stroke-linecap="round"/>
        <path d="M12 8h.01" stroke="#59b5ff" stroke-width="3" stroke-linecap="round"/>
        <path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke="#59b5ff" stroke-width="2"/>
      </svg>
    </div>
    <div class="pageTitle">Informations</div>

    <button id="infoTelegramBtn" class="btnBig" type="button">📣 Canal Telegram</button>
    <button id="infoSnapBtn" class="btnBig" type="button">👻 Snapchat</button>
  </div>

  <!-- ✅ PAGE Contact -->
  <div id="pageContact" class="page hidden">
    <div class="centerIcon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 12a8 8 0 0 1 16 0v6a2 2 0 0 1-2 2h-2" stroke="#59b5ff" stroke-width="2" stroke-linecap="round"/>
        <path d="M4 14h3a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-5Z" stroke="#59b5ff" stroke-width="2"/>
        <path d="M20 14h-3a2 2 0 0 0-2 2v1a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-5Z" stroke="#59b5ff" stroke-width="2"/>
      </svg>
    </div>
    <div class="pageTitle">Support</div>
    <div style="opacity:.8; line-height:1.4; margin-bottom:16px;">
      Si vous rencontrez un problème ou une question, vous pouvez contacter notre support sur Telegram.
    </div>
    <button id="contactBtn" class="btnBig" type="button">✈️ Contacter @SonicShop_Officiel</button>
  </div>

  <!-- ✅ Bouton panier (comme ta photo) -->
  <div id="cartFab" class="cartFab" title="Panier">
    🛒 <span class="sr">Panier</span>
    <span id="cartCount" class="cartCount">0</span>
  </div>

  <!-- ✅ Panier complet (avec livraison / paiement / etc.) -->
  <div id="cartModal" class="cartModal hidden">
    <div class="cartSheet">
      <div class="cartHeader">
        <div class="cartTitle">Votre Panier</div>
        <button id="cartClose" class="cartClose">✕</button>
      </div>

      <div id="cartItems" class="cartItems"></div>

      <div class="cartTotalRow">
        <div>Total :</div>
        <div id="cartTotal" class="cartTotal">0.00 €</div>
      </div>

      <div class="cartSectionTitle">Sélectionnez votre type de commande :</div>
      <div class="cartRadios">
        <label class="radioLine">
          <input type="radio" name="deliveryType" value="Meetup" checked />
          <span>Meetup</span>
        </label>
        <label class="radioLine">
          <input type="radio" name="deliveryType" value="Livraison" />
          <span>Livraison</span>
        </label>
      </div>

      <div class="cartForm">
        <input id="cityInput" class="cartInput" placeholder="Ville / Région" />
        <input id="addressInput" class="cartInput hidden" placeholder="Adresse (si livraison)" />
        <input id="paymentInput" class="cartInput" placeholder="Moyen de paiement" />
        <input id="nameInput" class="cartInput" placeholder="Ton prénom" />
        <input id="phoneInput" class="cartInput" placeholder="Ton téléphone (ex: 06...)" inputmode="tel" />
        <textarea id="noteInput" class="cartTextarea" placeholder="Note (optionnel)"></textarea>
      </div>

      <button id="confirmBtn" class="cartConfirm">Confirmer la commande</button>
    </div>
  </div>

  <!-- ✅ MENU DRAWER (comme tes photos) -->
  <div id="menuModal" class="menuModal hidden">
    <div class="menuDrawer" role="dialog" aria-modal="true">
      <button id="menuClose" class="menuClose" type="button">✕</button>

      <div id="menuHome" class="menuItem active">Accueil</div>
      <div id="menuPromo" class="menuItem">Pack / Promo</div>
      <div id="menuInfos" class="menuItem">Informations</div>
      <div id="menuContact" class="menuItem">Contact</div>
    </div>
  </div>

<script>
  // ====== CONFIG (IMPORTANT: doit matcher product.html) ======
  const CART_KEY = "sonic_cart_v1";
  const API_URL  = "https://sonic-telegram-bot.vercel.app/api/telegram";

  // ✅ TES LIENS (comme tu as donné)
  const CHANNEL_TELEGRAM_URL = "https://t.me/sonic_officiel_coffee";
  const SNAP_URL = "https://snapchat.com/t/6vukTjdx";
  const CONTACT_USERNAME = "SonicShop_Officiel"; // sans @

  // ✅ Promos (tu modifies ici quand tu veux)
  const PROMOS = [
    // Exemple :
    // { badgeLeft:"17% OFF", badgeLeftRed:true, badgeRight:"Packs", title:"PACK DÉCOUVERTE", oldPrice:60, price:50 },
  ];

  let DATA;

  function uniq(arr){ return [...new Set(arr.filter(Boolean))].sort(); }

  // ====== CART UTILS ======
  function loadCart(){
    try { return JSON.parse(localStorage.getItem(CART_KEY) || "[]"); }
    catch { return []; }
  }
  function saveCart(cart){
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }
  function cartCount(cart){
    return cart.reduce((sum, it) => sum + (it.count || 1), 0);
  }
  function cartTotal(cart){
    return cart.reduce((sum, it) => sum + ((Number(it.price)||0) * (it.count || 1)), 0);
  }
  function makeKey(item){
    return `${item.product}__${item.qty}`;
  }
  function getDeliveryType(){
    const el = document.querySelector('input[name="deliveryType"]:checked');
    return el ? el.value : "Meetup";
  }

  async function sendOrderToTelegram(order) {
    try {
      const r = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(order),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) return { ok:false, data };
      return { ok:true, data };
    } catch (e) {
      return { ok:false, error: String(e) };
    }
  }

  // ====== CART UI ======
  const cartFab      = () => document.getElementById("cartFab");
  const cartCountEl  = () => document.getElementById("cartCount");
  const cartModal    = () => document.getElementById("cartModal");
  const cartClose    = () => document.getElementById("cartClose");
  const cartItemsEl  = () => document.getElementById("cartItems");
  const cartTotalEl  = () => document.getElementById("cartTotal");

  const cityInput    = () => document.getElementById("cityInput");
  const addressInput = () => document.getElementById("addressInput");
  const paymentInput = () => document.getElementById("paymentInput");
  const nameInput    = () => document.getElementById("nameInput");
 const phoneInput = () => document.getElementById("phoneInput");
  const noteInput    = () => document.getElementById("noteInput");
  const confirmBtn   = () => document.getElementById("confirmBtn");

  function renderCart(){
    const cart = loadCart();

    // badge
    if (cartCountEl()) cartCountEl().textContent = String(cartCount(cart));

    // items
    if (!cartItemsEl()) return;
    cartItemsEl().innerHTML = "";

    if (cart.length === 0) {
      const empty = document.createElement("div");
      empty.style.opacity = ".85";
      empty.style.padding = "10px";
      empty.textContent = "Ton panier est vide.";
      cartItemsEl().appendChild(empty);
    } else {
      cart.forEach((it) => {
        const row = document.createElement("div");
        row.className = "cartItem";

        const left = document.createElement("div");
        left.className = "cartItemLeft";

        const title = document.createElement("div");
        title.className = "cartItemName";
        title.textContent = it.product || "-";

        const sub = document.createElement("div");
        sub.className = "cartItemSub";
        sub.textContent = `${it.qty || "-"} — ${Number(it.price)||0}€ / unité`;

        left.appendChild(title);
        left.appendChild(sub);

        const right = document.createElement("div");
        right.className = "cartItemRight";

        const minus = document.createElement("button");
        minus.className = "qtyBtn";
        minus.textContent = "−";
        minus.onclick = () => {
          const c = loadCart();
          const key = makeKey(it);
          const idx = c.findIndex(x => makeKey(x) === key);
          if (idx >= 0) {
            c[idx].count = (c[idx].count || 1) - 1;
            if (c[idx].count <= 0) c.splice(idx, 1);
            saveCart(c);
            renderCart();
          }
        };

        const qty = document.createElement("div");
        qty.className = "qtyVal";
        qty.textContent = String(it.count || 1);

        const plus = document.createElement("button");
        plus.className = "qtyBtn";
        plus.textContent = "+";
        plus.onclick = () => {
          const c = loadCart();
          const key = makeKey(it);
          const idx = c.findIndex(x => makeKey(x) === key);
          if (idx >= 0) {
            c[idx].count = (c[idx].count || 1) + 1;
            saveCart(c);
            renderCart();
          }
        };

        const trash = document.createElement("button");
        trash.className = "trashBtn";
        trash.textContent = "🗑️";
        trash.onclick = () => {
          const c = loadCart();
          const key = makeKey(it);
          saveCart(c.filter(x => makeKey(x) !== key));
          renderCart();
        };

        right.appendChild(minus);
        right.appendChild(qty);
        right.appendChild(plus);
        right.appendChild(trash);

        row.appendChild(left);
        row.appendChild(right);

        cartItemsEl().appendChild(row);
      });
    }

    // total
    if (cartTotalEl()) cartTotalEl().textContent = `${cartTotal(cart).toFixed(2)} €`;

    // adresse visible uniquement si livraison
    const delivery = getDeliveryType();
    if (addressInput()) {
      if (delivery === "Livraison") addressInput().classList.remove("hidden");
      else addressInput().classList.add("hidden");
    }
  }

  function openCart(){
    if (!cartModal()) return;
    cartModal().classList.remove("hidden");
    renderCart();
  }
  function closeCart(){
    if (!cartModal()) return;
    cartModal().classList.add("hidden");
  }

  // ====== PRODUCTS GRID (ton code, inchangé) ======
  function render(){
    const cat = document.getElementById('catSelect').value;
    const brand = document.getElementById('brandSelect').value;

    const list = DATA.products.filter(p=>{
      if(cat && p.category!==cat) return false;
      if(brand && p.brand!==brand) return false;
      return true;
    });

    const grid = document.getElementById('grid');
    grid.innerHTML = "";

    list.forEach(p=>{
      const card = document.createElement('div');
      card.className = "card";
      card.onclick = ()=> location.href = `product.html?id=${encodeURIComponent(p.id)}`;

      card.innerHTML = `
        <div class="tag">🏷️ ${p.category || ""}</div>
        <div class="img"><img src="${p.image || ""}" alt=""></div>
        <div class="body">
          <p class="name">${p.name || ""}</p>
          <p class="sub">🕵️ ${p.brand || ""}</p>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // =========================
  // ✅ MENU + PAGES
  // =========================
  const pages = {
    home: document.getElementById("pageHome"),
    promo: document.getElementById("pagePromo"),
    infos: document.getElementById("pageInfos"),
    contact: document.getElementById("pageContact"),
  };

  const menuModal = document.getElementById("menuModal");
  const menuBtn = document.getElementById("menuBtn");
  const menuClose = document.getElementById("menuClose");

  const menuItems = {
    home: document.getElementById("menuHome"),
    promo: document.getElementById("menuPromo"),
    infos: document.getElementById("menuInfos"),
    contact: document.getElementById("menuContact"),
  };

  function openMenu(){ menuModal.classList.remove("hidden"); }
  function closeMenuDrawer(){ menuModal.classList.add("hidden"); }

  function setActiveMenu(key){
    Object.keys(menuItems).forEach(k=>{
      menuItems[k].classList.toggle("active", k === key);
    });
  }

  function showPage(key){
    Object.keys(pages).forEach(k=>{
      pages[k].classList.toggle("hidden", k !== key);
    });
    setActiveMenu(key);
    closeMenuDrawer();
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  function renderPromos(){
    const wrap = document.getElementById("promoList");
    wrap.innerHTML = "";

    if (!PROMOS.length) {
      const p = document.createElement("div");
      p.style.opacity = ".85";
      p.style.padding = "8px 2px";
      p.textContent = "Aucune promotion pour le moment.";
      wrap.appendChild(p);
      return;
    }

    PROMOS.forEach(p=>{
      const card = document.createElement("div");
      card.className = "promoCard";

      const left = document.createElement("div");
      left.className = "promoLeft";

      const badges = document.createElement("div");
      badges.className = "promoBadges";

      const b1 = document.createElement("div");
      b1.className = "pillBadge" + (p.badgeLeftRed ? " pillRed" : "");
      b1.textContent = p.badgeLeft || "";

      const b2 = document.createElement("div");
      b2.className = "pillBadge";
      b2.textContent = p.badgeRight || "";

      badges.appendChild(b1);
      badges.appendChild(b2);

      const title = document.createElement("div");
      title.className = "promoTitle";
      title.textContent = p.title || "";

      left.appendChild(badges);
      left.appendChild(title);

      const right = document.createElement("div");
      right.className = "promoPrice";
      right.innerHTML = `${p.oldPrice ? `<span class="promoOld">${p.oldPrice}€</span>` : ""}${p.price} €`;

      card.appendChild(left);
      card.appendChild(right);
      wrap.appendChild(card);
    });
  }

  // Infos buttons
  function setupInfoButtons(){
    const t = document.getElementById("infoTelegramBtn");
    const s = document.getElementById("infoSnapBtn");
    if (t) t.onclick = ()=> window.open(CHANNEL_TELEGRAM_URL, "_blank");
    if (s) s.onclick = ()=> window.open(SNAP_URL, "_blank");

    const c = document.getElementById("contactBtn");
    if (c) c.onclick = ()=> window.open(`https://t.me/${CONTACT_USERNAME}`, "_blank");
  }

  (async ()=>{
    // bind panier
    if (cartFab()) cartFab().onclick = openCart;
    if (cartClose()) cartClose().onclick = closeCart;

    if (cartModal()) {
      cartModal().addEventListener("click", (e) => {
        if (e.target === cartModal()) closeCart();
      });
    }
    document.addEventListener("change", (e) => {
      if (e.target && e.target.name === "deliveryType") renderCart();
    });

    // ✅ bind menu
    if (menuBtn) menuBtn.onclick = openMenu;
    if (menuClose) menuClose.onclick = closeMenuDrawer;
    if (menuModal) {
      menuModal.addEventListener("click", (e)=>{
        if (e.target === menuModal) closeMenuDrawer();
      });
    }
    menuItems.home.onclick = ()=> showPage("home");
    menuItems.promo.onclick = ()=> showPage("promo");
    menuItems.infos.onclick = ()=> showPage("infos");
    menuItems.contact.onclick = ()=> showPage("contact");

    // load products
    const res = await fetch('products.json', {cache:'no-store'});
    DATA = await res.json();

    document.getElementById('shopName').textContent = DATA.shopName || "Mini-App";
    document.getElementById('shopLogo').src = DATA.shopLogo || document.getElementById('shopLogo').src;

    const cats = uniq(DATA.products.map(p=>p.category));
    const brands = uniq(DATA.products.map(p=>p.brand));

    const catSelect = document.getElementById('catSelect');
    cats.forEach(c=>{
      const o = document.createElement('option'); o.value=c; o.textContent=c;
      catSelect.appendChild(o);
    });

    const brandSelect = document.getElementById('brandSelect');
    brands.forEach(b=>{
      const o = document.createElement('option'); o.value=b; o.textContent=b;
      brandSelect.appendChild(o);
    });

    catSelect.onchange = render;
    brandSelect.onchange = render;

    render();

    // init panier
    renderCart();

    // init pages
    renderPromos();
    setupInfoButtons();

    // confirm commande (photo 3-4)
    if (confirmBtn()) {
      confirmBtn().onclick = async () => {
        const cart = loadCart();
        if (cart.length === 0) { alert("❌ Ton panier est vide"); return; }

        const delivery = getDeliveryType();
        const city = (cityInput()?.value || "").trim();
        const address = (addressInput()?.value || "").trim();
        const payment = (paymentInput()?.value || "").trim();
        const customer_name = (nameInput()?.value || "").trim();
        // ✅ Vrai Telegram (impossible à tricher)
const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
const realTelegram = tgUser?.username ? ("@" + tgUser.username) : "";
        
        if (telegramInput()) {
  telegramInput().value = realTelegram;
  telegramInput().readOnly = true;
}

// ✅ Téléphone (tapé par le client)
const phone = (phoneInput()?.value || "").trim();

if (!realTelegram) {
  alert("❌ Tu dois avoir un @Telegram défini dans Telegram (Paramètres > Nom d'utilisateur).");
  return;
}

if (!phone) { alert("❌ Téléphone obligatoire"); return; }

const phoneClean = phone.replace(/\s+/g, "");
if (!/^[0-9+().-]{6,20}$/.test(phoneClean)) {
  alert("❌ Numéro invalide");
  return;
}
        const note = (noteInput()?.value || "").trim();

        if (!city) { alert("❌ Ville / Région obligatoire"); return; }
        if (delivery === "Livraison" && !address) { alert("❌ Adresse obligatoire pour livraison"); return; }
        if (!payment) { alert("❌ Moyen de paiement obligatoire"); return; }
        if (!customer_name) { alert("❌ Nom obligatoire"); return; }
        if (!customer_telegram) { alert("❌ @Telegram obligatoire"); return; }
        if (customer_telegram[0] !== "@") { alert("❌ Mets un @ au début (ex: @pseudo)"); return; }

        const payload = {
          products: cart.map(it => ({
            product: it.product,
            qty: it.qty,
            price: Number(it.price) || 0,
            count: it.count || 1,
          })),
          delivery,
          city,
          address: delivery === "Livraison" ? address : "-",
          payment,
          customer_name,
          customer_telegram: realTelegram,
          note: note || "Commande via mini-app",
        };

        confirmBtn().disabled = true;
        confirmBtn().textContent = "Envoi en cours...";

        const result = await sendOrderToTelegram(payload);

        confirmBtn().disabled = false;
        confirmBtn().textContent = "Confirmer la commande";

        if (result.ok) {
          alert("✅ Commande envoyée !");
          saveCart([]);
          renderCart();
          closeCart();
        } else {
          alert("❌ Erreur d’envoi (API). Regarde les logs Vercel.");
        }
      };
    }

  })();

  document.addEventListener('touchstart', () => {
    const v = document.querySelector('.banner-video');
    if (v) v.play();
  }, { once: true });
</script>

</body>
</html>
