<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produit</title>
  <style>
    body{margin:0;font-family:Arial;background:#0b0f14;color:#fff}
    .wrap{max-width:900px;margin:0 auto;padding:14px 14px 30px}
    a{color:#9ad1ff;text-decoration:none}
    .back{display:inline-flex;align-items:center;gap:8px;background:#121a24;border:1px solid #243244;border-radius:999px;padding:10px 12px}
    .card{margin-top:12px;background:#121a24;border:1px solid #243244;border-radius:18px;overflow:hidden}
    .video{background:#000}
    video{width:100%;height:auto;display:block}
    .content{padding:14px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;gap:6px;background:#0f1722;border:1px solid #2b3c51;border-radius:999px;padding:6px 10px;font-size:12px;opacity:.95}
    h1{margin:10px 0 6px;font-size:28px}
    .desc{opacity:.85;white-space:pre-line;line-height:1.4}

    /* Variantes style “photo 2” */
    .vlist{display:flex;flex-direction:column;gap:12px;margin-top:14px}
    .vrow{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      padding: 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .vleft{display:flex;flex-direction:column;gap:6px}
    .vlabel{font-weight:900;font-size:18px}
    .vprice{opacity:.85}

    .vright{display:flex;align-items:center;gap:10px}
    .qtyInput{
      width:64px;height:40px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.25);
      color:#fff;
      text-align:center;
      font-weight:900;
      outline:none;
    }
    .addBtn{
      height:40px;
      padding:0 16px;
      border-radius:12px;
      border:0;
      background:#2d8cff;
      color:#071021;
      font-weight:900;
      cursor:pointer;
    }

    .cta{
      margin-top:12px;
      background:#2b8cff;
      border:0;color:#fff;border-radius:999px;
      padding:14px 16px;font-weight:800;width:100%;
      cursor:pointer;
      display:block;text-align:center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Retour</a>

    <div class="card">
      <div class="video">
        <video id="vid" controls playsinline></video>
      </div>
      <div class="content">
        <div class="row">
          <div class="pill" id="catPill"></div>
          <div class="pill" id="brandPill"></div>
        </div>

        <h1 id="name"></h1>
        <div class="desc" id="desc"></div>

        <div class="vlist" id="variants"></div>

        <!-- IMPORTANT : ce bouton renvoie vers index.html et ouvre le panier -->
        <a class="cta" id="orderLink" href="index.html?openCart=1">Commander via Telegram</a>
      </div>
    </div>
  </div>

<script>
let DATA, product;
const CART_KEY = "sonic_cart_v1";

function qs(k){ return new URLSearchParams(location.search).get(k); }
function loadCart(){ try { return JSON.parse(localStorage.getItem(CART_KEY) || "[]"); } catch { return []; } }
function saveCart(cart){ localStorage.setItem(CART_KEY, JSON.stringify(cart)); }
function makeKey(item){ return `${item.product}__${item.qty}__${Number(item.price)||0}`; }

function addToCart(item, countToAdd){
  const cart = loadCart();
  const key = makeKey(item);
  const idx = cart.findIndex(x => makeKey(x) === key);

  if (idx >= 0) cart[idx].count = (cart[idx].count || 1) + countToAdd;
  else cart.push({ ...item, count: countToAdd });

  saveCart(cart);

  alert(`🛒 Ajouté ✅\n\nProduit : ${item.product}\nVariante : ${item.qty}\nPrix : ${item.price}€\nNombre : ${countToAdd}`);
}

(async () => {
  const res = await fetch("products.json", { cache: "no-store" });
  DATA = await res.json();

  const id = qs("id");
  product = (DATA.products || []).find(p => String(p.id) === String(id));

  if (!product) {
    document.body.innerHTML = "<p>Produit introuvable</p>";
    return;
  }

  const vid = document.getElementById("vid");
  if (vid) vid.src = product.video || "";

  const catPill = document.getElementById("catPill");
  if (catPill) catPill.textContent = product.category || "";

  const brandPill = document.getElementById("brandPill");
  if (brandPill) brandPill.textContent = product.brand || "";

  const nameEl = document.getElementById("name");
  if (nameEl) nameEl.textContent = product.name || "";

  const descEl = document.getElementById("desc");
  if (descEl) descEl.textContent = product.description || "";

  const variants = document.getElementById("variants");
  variants.innerHTML = "";

  (product.variants || []).forEach(v => {
    const row = document.createElement("div");
    row.className = "vrow";

    const left = document.createElement("div");
    left.className = "vleft";
    left.innerHTML = `
      <div class="vlabel">${v.label}</div>
      <div class="vprice">${Number(v.price)||0} €</div>
    `;

    const right = document.createElement("div");
    right.className = "vright";

    const qty = document.createElement("input");
    qty.className = "qtyInput";
    qty.type = "number";
    qty.min = "1";
    qty.value = "1";

    const add = document.createElement("button");
    add.className = "addBtn";
    add.textContent = "Ajouter";
    add.onclick = () => {
      const n = Math.max(1, parseInt(qty.value || "1", 10));
      addToCart({
        product: product.name,
        qty: v.label,
        price: Number(v.price) || 0,
      }, n);
    };

    right.appendChild(qty);
    right.appendChild(add);

    row.appendChild(left);
    row.appendChild(right);
    variants.appendChild(row);
  });
})();
</script>
</body>
</html>
