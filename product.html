<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produit</title>
  <style>
    body{margin:0;font-family:Arial;background:#0b0f14;color:#fff}
    .wrap{max-width:900px;margin:0 auto;padding:14px 14px 30px}
    a{color:#9ad1ff;text-decoration:none}
    .back{display:inline-flex;align-items:center;gap:8px;background:#121a24;border:1px solid #243244;border-radius:999px;padding:10px 12px}
    .card{margin-top:12px;background:#121a24;border:1px solid #243244;border-radius:18px;overflow:hidden}
    .video{background:#000}
    video{width:100%;height:auto;display:block}
    .content{padding:14px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;gap:6px;background:#0f1722;border:1px solid #2b3c51;border-radius:999px;padding:6px 10px;font-size:12px;opacity:.95}
    h1{margin:10px 0 6px;font-size:28px}
    .desc{opacity:.85;white-space:pre-line;line-height:1.4}
    .variants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
    .btn{background:#0f1722;border:1px solid #2b3c51;border-radius:999px;padding:12px 14px;color:#9ad1ff;font-weight:700;cursor:pointer}
    .cta{margin-top:12px;background:#2b8cff;border:0;color:#fff;border-radius:999px;padding:14px 16px;font-weight:800;width:100%;cursor:pointer}
    @media(max-width:420px){ .variants{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Retour</a>

    <div class="card">
      <div class="video">
        <video id="vid" controls playsinline></video>
      </div>
      <div class="content">
        <div class="row">
          <div class="pill" id="catPill"></div>
          <div class="pill" id="brandPill"></div>
        </div>

        <h1 id="name"></h1>
        <div class="desc" id="desc"></div>

        <div class="variants" id="variants"></div>

       <a class="cta" id="orderLink" href="#" role="button">
  Commander via Telegram
</a>
      </div>
    </div>
  </div>

 <script>
  let DATA, product;

  // --- Panier (persistant) ---
  const CART_KEY = "sonic_cart_v1";
  function loadCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY) || "[]"); }
    catch { return []; }
  }
  function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }
  function cartCount(cart) {
    return cart.reduce((sum, it) => sum + (Number(it.count) || 1), 0);
  }

  function qs(k){ return new URLSearchParams(location.search).get(k); }
  function formatPrice(n){ return `${n}€`; }

  function updateButtonsUI() {
    const cart = loadCart();
    const count = cartCount(cart);

    const orderBtn = document.getElementById("orderBtn");
    if (orderBtn) orderBtn.textContent = count ? `Commander (${count})` : "Commander via Telegram";

    // Optionnel: bouton "Voir panier" s'il n'existe pas
    let viewBtn = document.getElementById("viewCartBtn");
    if (!viewBtn) {
      viewBtn = document.createElement("button");
      viewBtn.id = "viewCartBtn";
      viewBtn.className = "btn";
      viewBtn.style.marginTop = "10px";
      viewBtn.textContent = count ? `Voir panier (${count})` : "Voir panier (0)";

      // on l'ajoute sous le bouton commander si possible
      if (orderBtn && orderBtn.parentElement) {
        orderBtn.parentElement.appendChild(viewBtn);
      }
    } else {
      viewBtn.textContent = count ? `Voir panier (${count})` : "Voir panier (0)";
    }

    viewBtn.onclick = () => showCartModal();
  }

  // --- Modal panier simple ---
  function showCartModal() {
    const cart = loadCart();

    let modal = document.getElementById("cartModal");
    if (!modal) {
      modal = document.createElement("div");
      modal.id = "cartModal";
      modal.style.position = "fixed";
      modal.style.inset = "0";
      modal.style.background = "rgba(0,0,0,0.6)";
      modal.style.display = "flex";
      modal.style.alignItems = "center";
      modal.style.justifyContent = "center";
      modal.style.zIndex = "9999";

      modal.innerHTML = `
        <div style="width:92%;max-width:520px;background:#0f172a;border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:16px;color:#fff;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div style="font-size:18px;font-weight:700;">Votre panier</div>
            <button id="closeCartModal" class="btn" style="padding:8px 12px;">✕</button>
          </div>

          <div id="cartModalList" style="max-height:55vh;overflow:auto;margin-bottom:12px;"></div>

          <div style="display:flex;gap:10px;">
            <button id="clearCartBtn" class="btn" style="flex:1;">Vider</button>
            <button id="closeCartBtn2" class="btn" style="flex:1;">Fermer</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelector("#closeCartModal").onclick = () => (modal.style.display = "none");
      modal.querySelector("#closeCartBtn2").onclick = () => (modal.style.display = "none");
      modal.querySelector("#clearCartBtn").onclick = () => {
        saveCart([]);
        renderCartModal();
        updateButtonsUI();
      };

      // fermer si clic hors boîte
      modal.addEventListener("click", (e) => {
        if (e.target === modal) modal.style.display = "none";
      });
    }

    renderCartModal();
    modal.style.display = "flex";
  }

  function renderCartModal() {
    const cart = loadCart();
    const list = document.getElementById("cartModalList");
    if (!list) return;

    if (!cart.length) {
      list.innerHTML = `<div style="opacity:0.8;">Panier vide.</div>`;
      return;
    }

    const rows = cart.map((it, idx) => {
      const lineTotal = (Number(it.price)||0) * (Number(it.count)||1);
      return `
        <div style="border:1px solid rgba(255,255,255,0.10);border-radius:12px;padding:12px;margin-bottom:10px;">
          <div style="font-weight:700;">${escapeHtml(it.product || "-")}</div>
          <div style="opacity:0.9;margin-top:4px;">Quantité: ${escapeHtml(it.qty || "-")} • Prix: ${escapeHtml(String(it.price ?? "-"))}€</div>
          <div style="opacity:0.9;margin-top:4px;">Nb:
            <button class="btn" data-act="dec" data-idx="${idx}" style="padding:6px 10px;">-</button>
            <span style="display:inline-block;min-width:28px;text-align:center;">${it.count || 1}</span>
            <button class="btn" data-act="inc" data-idx="${idx}" style="padding:6px 10px;">+</button>
            <button class="btn" data-act="del" data-idx="${idx}" style="padding:6px 10px;float:right;">🗑</button>
          </div>
          <div style="margin-top:6px;font-weight:700;">Total ligne: ${lineTotal.toFixed(2)}€</div>
        </div>
      `;
    }).join("");

    const total = cart.reduce((sum, it) => sum + (Number(it.price)||0) * (Number(it.count)||1), 0);

    list.innerHTML = rows + `<div style="font-size:18px;font-weight:800;margin-top:8px;">Total: ${total.toFixed(2)}€</div>`;

    // handlers +/- delete
    list.querySelectorAll("button[data-act]").forEach(btn => {
      btn.onclick = () => {
        const act = btn.getAttribute("data-act");
        const idx = Number(btn.getAttribute("data-idx"));
        const cart2 = loadCart();
        const item = cart2[idx];
        if (!item) return;

        if (act === "inc") item.count = (Number(item.count)||1) + 1;
        if (act === "dec") item.count = Math.max(1, (Number(item.count)||1) - 1);
        if (act === "del") cart2.splice(idx, 1);

        saveCart(cart2);
        renderCartModal();
        updateButtonsUI();
      };
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  // --- MAIN ---
  (async () => {
    const res = await fetch("products.json", { cache: "no-store" });
    DATA = await res.json();

    const id = qs("id");
    product = DATA.products.find(p => String(p.id) === String(id));

    if (!product) {
      document.body.innerHTML = `<div style="padding:20px">Produit introuvable. <a href="index.html">Retour</a></div>`;
      return;
    }

    // Remplir la page produit
    document.getElementById("vid").src = product.video || "";
    document.getElementById("catPill").textContent = product.category || "";
    document.getElementById("brandPill").textContent = product.brand || "";
    document.getElementById("name").textContent = product.name || "";
    document.getElementById("desc").textContent = product.description || "";

    // Boutons prix -> ajout panier
    const variantsEl = document.getElementById("variants");
    variantsEl.innerHTML = "";

    product.variants.forEach(v => {
      const b = document.createElement("button");
      b.className = "btn";
      b.textContent = `${v.label} ${formatPrice(v.price)}`;

      b.onclick = () => {
        const cart = loadCart();
        cart.push({
          product: product.name,
          qty: v.label,
          price: v.price,
          count: 1
        });
        saveCart(cart);

        updateButtonsUI();

        alert(
          `🛒 Ajouté au panier ✅\n\n` +
          `Produit : ${product.name}\n` +
          `Quantité : ${v.label}\n` +
          `Prix : ${v.price}€`
        );
      };

      variantsEl.appendChild(b);
    });

    updateButtonsUI();

    // Checkout (sans envoi)
    document.getElementById("orderBtn").onclick = async () => {
      const cart = loadCart();
      if (!cart.length) {
        alert("❌ Ton panier est vide");
        return;
      }

      // petit récap avant
      const recap = cart.map((it, i) => `${i+1}. ${it.product} — ${it.qty} — ${it.price}€ x${it.count || 1}`).join("\n");
      const ok = confirm("✅ Récap panier :\n\n" + recap + "\n\nContinuer ?");
      if (!ok) return;

      const delivery = prompt("🚚 Livraison ou Meet-up ?");
      if (!delivery) return;

      const city = prompt("🏙️ Ville / Région ?");
      if (!city) return;

      const address = (delivery.toLowerCase().includes("liv"))
        ? prompt("📍 Adresse de livraison ?")
        : "-";

      const payment = prompt("💳 Moyen de paiement ?");
      if (!payment) return;

      const name = prompt("👤 Ton prénom ?");
      if (!name) return;

      const phone = prompt("📞 Ton téléphone ?");
      if (!phone) return;

      const order = {
        products: cart,
        delivery,
        city,
        address: address || "-",
        payment,
        customer_name: name,
        customer_phone: phone,
        note: "Commande multi-produits via mini-app"
      };

      // ICI: pas d’envoi (conforme)
      console.log("ORDER_READY", order);
      alert("✅ Commande prête (voir console).");

      // Optionnel: vider panier après confirmation
      saveCart([]);
      updateButtonsUI();
    };
  })();
</script>
</body>
</html>
