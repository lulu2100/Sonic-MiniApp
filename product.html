<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produit</title>
  <style>
    body{margin:0;font-family:Arial;background:#0b0f14;color:#fff}
    .wrap{max-width:900px;margin:0 auto;padding:14px 14px 30px}
    a{color:#9ad1ff;text-decoration:none}
    .back{display:inline-flex;align-items:center;gap:8px;background:#121a24;border:1px solid #243244;border-radius:999px;padding:10px 12px}
    .card{margin-top:12px;background:#121a24;border:1px solid #243244;border-radius:18px;overflow:hidden}
    .video{background:#000}
    video{width:100%;height:auto;display:block}
    .content{padding:14px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;gap:6px;background:#0f1722;border:1px solid #2b3c51;border-radius:999px;padding:6px 10px;font-size:12px;opacity:.95}
    h1{margin:10px 0 6px;font-size:28px}
    .desc{opacity:.85;white-space:pre-line;line-height:1.4}
    .variants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
    .btn{background:#0f1722;border:1px solid #2b3c51;border-radius:999px;padding:12px 14px;color:#9ad1ff;font-weight:700;cursor:pointer}
    .cta{margin-top:12px;background:#2b8cff;border:0;color:#fff;border-radius:999px;padding:14px 16px;font-weight:800;width:100%;cursor:pointer}
    @media(max-width:420px){ .variants{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Retour</a>

    <div class="card">
      <div class="video">
        <video id="vid" controls playsinline></video>
      </div>
      <div class="content">
        <div class="row">
          <div class="pill" id="catPill"></div>
          <div class="pill" id="brandPill"></div>
        </div>

        <h1 id="name"></h1>
        <div class="desc" id="desc"></div>

        <div class="variants" id="variants"></div>

       <a class="cta" id="orderLink" href="#" role="button">
  Commander via Telegram
</a>
      </div>
    </div>
  </div>
<!-- Bouton panier flottant + badge -->
<button id="cartBtn" style="
  position:fixed; right:16px; top:110px; z-index:9999;
  padding:10px 12px; border-radius:999px; border:1px solid #2a2a2a;
  background:#111; color:#fff; font-weight:700;">
  🛒 Panier <span id="cartCount" style="
    display:inline-block; min-width:22px; padding:2px 8px;
    margin-left:6px; border-radius:999px; background:#2b7cff; color:#fff;">0</span>
</button>

<!-- Modal panier -->
<div id="cartModal" style="
  position:fixed; inset:0; z-index:9998; display:none;
  background:rgba(0,0,0,0.55);">
  <div style="
    max-width:520px; margin:80px auto; background:#0f0f0f; color:#fff;
    border:1px solid #2a2a2a; border-radius:16px; padding:16px;">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <h3 style="margin:0;">Votre panier</h3>
      <button id="cartClose" style="
        background:transparent; color:#fff; border:0; font-size:22px; cursor:pointer;">✕</button>
    </div>

    <div id="cartItems" style="margin-top:12px;"></div>

    <div style="display:flex; justify-content:space-between; margin-top:14px; font-weight:800;">
      <div>Total</div>
      <div id="cartTotal">0€</div>
    </div>

    <div style="display:flex; gap:10px; margin-top:14px;">
      <button id="cartClear" style="
        flex:1; padding:12px; border-radius:12px; border:1px solid #2a2a2a;
        background:#1a1a1a; color:#fff; font-weight:700; cursor:pointer;">
        Vider
      </button>
      <button id="cartCheckout" style="
        flex:2; padding:12px; border-radius:12px; border:0;
        background:#2b7cff; color:#fff; font-weight:800; cursor:pointer;">
        Commander
      </button>
    </div>
  </div>
</div>
 <script>
  let DATA, product;

  // ---- Panier persistant (localStorage) ----
  const CART_KEY = "sonic_cart_v1";
  let CART = JSON.parse(localStorage.getItem(CART_KEY) || "[]");

  function qs(k){ return new URLSearchParams(location.search).get(k); }
  function formatPrice(n){ return `${Number(n||0)}€`; }

  async function sendOrderToTelegram(order) {
    const API_URL = "https://sonic-telegram-bot.vercel.app/api/telegram";

    try {
      const r = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(order),
      });

      const data = await r.json().catch(() => ({}));
      return { ok: r.ok, data };
    } catch (e) {
      console.error("Fetch failed:", e);
      return { ok: false, error: String(e) };
    }
  }

  function saveCart(){
    localStorage.setItem(CART_KEY, JSON.stringify(CART));
    renderCart();
  }

  function cartCount(){
    return CART.reduce((sum, it) => sum + (it.count || 1), 0);
  }

  function cartTotal(){
    return CART.reduce((sum, it) => sum + (Number(it.price||0) * Number(it.count||1)), 0);
  }

  function addToCart(item){
    // item: { productId, product, variant, qtyLabel, price, count }
    const key = `${item.productId}__${item.qtyLabel}__${item.price}`;
    const existing = CART.find(x => x.key === key);
    if (existing) existing.count += 1;
    else CART.push({ ...item, key, count: 1 });

    alert(`🛒 Ajouté au panier ✅\n\nProduit : ${item.product}\nQuantité : ${item.qtyLabel}\nPrix : ${item.price}€`);
    saveCart();
  }

  function changeCount(key, delta){
    const it = CART.find(x => x.key === key);
    if (!it) return;
    it.count += delta;
    if (it.count <= 0) CART = CART.filter(x => x.key !== key);
    saveCart();
  }

  function removeItem(key){
    CART = CART.filter(x => x.key !== key);
    saveCart();
  }

  // ---- UI panier ----
  const cartBtn = () => document.getElementById("cartBtn");
  const cartCountEl = () => document.getElementById("cartCount");
  const cartModal = () => document.getElementById("cartModal");
  const cartItemsEl = () => document.getElementById("cartItems");
  const cartTotalEl = () => document.getElementById("cartTotal");

  function openCart(){ cartModal().style.display = "block"; }
  function closeCart(){ cartModal().style.display = "none"; }

  function renderCart(){
    if (cartCountEl()) cartCountEl().textContent = String(cartCount());
    if (cartTotalEl()) cartTotalEl().textContent = formatPrice(cartTotal());

    if (!cartItemsEl()) return;

    if (CART.length === 0){
      cartItemsEl().innerHTML = `<div style="opacity:.8; padding:10px;">Panier vide.</div>`;
      return;
    }

    cartItemsEl().innerHTML = CART.map(it => `
      <div style="
        display:flex; align-items:center; justify-content:space-between;
        padding:10px; border:1px solid #2a2a2a; border-radius:12px; margin-bottom:10px;">
        <div style="max-width:70%;">
          <div style="font-weight:800;">${it.product}</div>
          <div style="opacity:.8; font-size:13px;">${it.qtyLabel} — ${it.price}€ / unité</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button data-minus="${it.key}" style="width:34px; height:34px; border-radius:10px; border:1px solid #2a2a2a; background:#1a1a1a; color:#fff;">-</button>
          <div style="min-width:20px; text-align:center; font-weight:800;">${it.count}</div>
          <button data-plus="${it.key}" style="width:34px; height:34px; border-radius:10px; border:1px solid #2a2a2a; background:#1a1a1a; color:#fff;">+</button>
          <button data-del="${it.key}" title="Supprimer" style="width:34px; height:34px; border-radius:10px; border:1px solid #2a2a2a; background:#1a1a1a; color:#fff;">🗑️</button>
        </div>
      </div>
    `).join("");

    // bind buttons
    cartItemsEl().querySelectorAll("[data-minus]").forEach(b=>{
      b.onclick = () => changeCount(b.getAttribute("data-minus"), -1);
    });
    cartItemsEl().querySelectorAll("[data-plus]").forEach(b=>{
      b.onclick = () => changeCount(b.getAttribute("data-plus"), +1);
    });
    cartItemsEl().querySelectorAll("[data-del]").forEach(b=>{
      b.onclick = () => removeItem(b.getAttribute("data-del"));
    });
  }

  function ask(label, optional=false){
    const v = prompt(label);
    if (!optional && (!v || !String(v).trim())) return null;
    return (v || "").trim();
  }

  async function checkout(){
    if (CART.length === 0){
      alert("❌ Ton panier est vide");
      return;
    }

    const delivery = ask("🚚 Livraison ou Meet-up ?");
    if (!delivery) return;

    const city = ask("🏙️ Ville / Région ?");
    if (!city) return;

    const needAddress = delivery.toLowerCase().includes("liv");
    const address = needAddress ? ask("📍 Adresse de livraison ?") : "-";
    if (needAddress && !address) return;

    const payment = ask("💳 Moyen de paiement ?");
    if (!payment) return;

    const name = ask("👤 Ton prénom ?");
    if (!name) return;

    const phone = ask("📞 Ton téléphone ?");
    if (!phone) return;

    const note = ask("📝 Note (optionnel) ?", true) || "-";

    const res = await sendOrderToTelegram({
      products: CART.map(it => ({
        product: it.product,
        qty: it.qtyLabel,
        price: it.price,
        count: it.count
      })),
      delivery,
      city,
      address,
      payment,
      customer_name: name,
      customer_phone: phone,
      note
    });

    if (res.ok){
      alert("✅ Commande envoyée !");
      CART = [];
      saveCart();
      closeCart();
    } else {
      alert("❌ Erreur d'envoi (regarde la console / Vercel logs)");
      console.error(res);
    }
  }

  // ---- MAIN page ----
  (async () => {
    // bind panier UI
    document.getElementById("cartBtn").onclick = openCart;
    document.getElementById("cartClose").onclick = closeCart;
    document.getElementById("cartModal").onclick = (e) => { if (e.target.id === "cartModal") closeCart(); };
    document.getElementById("cartClear").onclick = () => { CART = []; saveCart(); };
    document.getElementById("cartCheckout").onclick = checkout;

    // load data
    const res = await fetch("products.json", { cache: "no-store" });
    DATA = await res.json();

    const id = qs("id");
    product = DATA.products.find(p => String(p.id) === String(id));

    if (!product){
      document.body.innerHTML = `<div style="padding:20px">Produit introuvable. <a href="index.html">Retour</a></div>`;
      return;
    }

    // fill product UI (tes ids existants)
    document.getElementById("vid").src = product.video || "";
    document.getElementById("catPill").textContent = product.category || "";
    document.getElementById("brandPill").textContent = product.brand || "";
    document.getElementById("name").textContent = product.name || "";
    document.getElementById("desc").textContent = product.description || "";

    // render variants buttons
    const variants = document.getElementById("variants");
    variants.innerHTML = "";

    product.variants.forEach(v => {
      const b = document.createElement("button");
      b.className = "btn";
      b.textContent = `${v.label}  ${formatPrice(v.price)}`;

      // ✅ CLIC PRIX = AJOUT AU PANIER (pas d'envoi Telegram ici)
      b.onclick = () => {
        addToCart({
          productId: product.id,
          product: product.name,
          qtyLabel: v.label,
          price: Number(v.price || 0)
        });
      };

      variants.appendChild(b);
    });

    // bouton "Commander via Telegram" = ouvre panier + checkout
    document.getElementById("orderBtn").onclick = () => {
      openCart();
    };

    // first render
    renderCart();
  })();
</script>
</body>
</html>
